<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Spinner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Mi Tablero de Control</h1>
        <div class="emoji" id="emoji">🚀</div>
        <div class="buttons">
            <button class="btn btn-start" id="btnStart">Inicio</button>
            <button class="btn btn-stop" id="btnStop">Fin</button>
            <button class="btn btn-launch" id="btnLaunch">Lanzar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
